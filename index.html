<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Área Ambiental</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip para descompactar arquivos .kmz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- toGeoJSON para converter KML para GeoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <!-- Leaflet (biblioteca de mapa) CSS e JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Google Fonts para uma melhor tipografia -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #map {
            height: 400px;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
        }
        .legend {
            padding: 6px 8px;
            font: 14px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Verificador de Área Ambiental</h1>
            <p class="text-gray-600 mt-2">Verifique se as suas coordenadas estão numa área ambiental carregada.</p>
            <p id="fileName" class="text-sm text-gray-500 mt-2"></p>
        </div>

        <div id="loading-section" class="text-center py-8">
            <div class="flex items-center justify-center">
                <div class="loader mr-3"></div>
                <p id="loading-status" class="text-gray-600">A carregar dados de áreas ambientais...</p>
            </div>
        </div>

        <div id="main-content" class="hidden">
            <div class="space-y-4">
                <div>
                    <label for="latitude" class="block text-sm font-medium text-gray-700">Latitude</label>
                    <input type="number" id="latitude" placeholder="-23.0478667" class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <label for="longitude" class="block text-sm font-medium text-gray-700">Longitude</label>
                    <input type="number" id="longitude" placeholder="-44.6344310" class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="getLocationBtn" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200 shadow-sm flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Usar Localização Atual
                </button>
                <button id="checkBtn" class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-200 shadow-sm">
                    Verificar
                </button>
            </div>

            <div id="result" class="mt-8 space-y-4">
                 <p class="text-gray-500 text-center">O resultado da verificação aparecerá aqui.</p>
            </div>
            
            <div id="map" class="mt-6"></div>
        </div>
    </div>

    <script>
        // Variáveis globais
        let environmentalGeoJson = null;
        let map = null;
        let userMarker = null;
        let areaLayerGroup = null; // Para a área destacada na verificação
        let allAreasLayer = null; // Para todas as áreas ambientais

        // URL do arquivo KMZ atualizado
        const environmentalKmzUrl = `https://raw.githubusercontent.com/brenderrangel/kmz/main/UCs_VIGENTE_(VERSAO 25.1).kmz?v=${new Date().getTime()}`;

        // Elementos da UI
        const loadingSection = document.getElementById('loading-section');
        const loadingStatus = document.getElementById('loading-status');
        const mainContent = document.getElementById('main-content');
        const latitudeInput = document.getElementById('latitude');
        const longitudeInput = document.getElementById('longitude');
        const getLocationBtn = document.getElementById('getLocationBtn');
        const checkBtn = document.getElementById('checkBtn');
        const resultDiv = document.getElementById('result');
        const fileNameEl = document.getElementById('fileName');

        // Funções de verificação de polígono
        function isPointInRing(point, ring) {
            const x = point[0], y = point[1];
            let isInside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i][0], yi = ring[i][1];
                const xj = ring[j][0], yj = ring[j][1];
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) isInside = !isInside;
            }
            return isInside;
        }

        function isPointInPolygon(point, polygon) {
            if (!polygon || polygon.length === 0) return false;
            if (!isPointInRing(point, polygon[0])) return false;
            for (let i = 1; i < polygon.length; i++) {
                if (isPointInRing(point, polygon[i])) return false;
            }
            return true;
        }

        function isPointInFeature(point, feature) {
            const geom = feature.geometry;
            if (!geom) return false;
            switch (geom.type) {
                case 'Polygon': return isPointInPolygon(point, geom.coordinates);
                case 'MultiPolygon': return geom.coordinates.some(polygon => isPointInPolygon(point, polygon));
                case 'GeometryCollection': return geom.geometries.some(subGeom => isPointInFeature(point, { geometry: subGeom }));
                default: return false;
            }
        }
        
        function initMap() {
            if (map) return;
            map = L.map('map').setView([-14.235, -51.925], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        async function processKmz(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Falha na rede para ${url}: ${response.statusText}`);
            const arrayBuffer = await response.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const kmlFile = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
            if (!kmlFile) throw new Error(`Nenhum ficheiro KML encontrado em ${url}.`);
            const kmlText = await zip.files[kmlFile].async('string');
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(kmlText, 'text/xml');
            return toGeoJSON.kml(xmlDoc);
        }
        
        function getStyleByOrgan(feature) {
            const desc = feature.properties.description || '';
            let color = "#95a5a6"; // Cinza (padrão)

            if (desc.includes('UC FEDERAL')) {
                color = "#3498db"; // Azul
            } else if (desc.includes('UC ESTADUAL')) {
                color = "#2ecc71"; // Verde
            } else if (desc.includes('UC MUNICIPAL')) {
                color = "#f1c40f"; // Amarelo
            }
            
            return {
                color: color,
                weight: 2,
                opacity: 0.65,
                fillOpacity: 0.1
            };
        }

        async function loadAllData() {
            try {
                environmentalGeoJson = await processKmz(environmentalKmzUrl);
                
                const fileName = environmentalKmzUrl.split('/').pop().split('?')[0];
                fileNameEl.textContent = `Arquivo carregado: ${decodeURIComponent(fileName)}`;

                loadingSection.classList.add('hidden');
                mainContent.classList.remove('hidden');
                initMap();

                // Adiciona todas as áreas ao mapa com cores baseadas no órgão
                if (environmentalGeoJson && environmentalGeoJson.features.length > 0) {
                    allAreasLayer = L.geoJSON(environmentalGeoJson, {
                        style: getStyleByOrgan
                    }).addTo(map);
                    map.fitBounds(allAreasLayer.getBounds());
                }
                
                // Adiciona a legenda ao mapa
                const legend = L.control({position: 'bottomright'});
                legend.onAdd = function (map) {
                    const div = L.DomUtil.create('div', 'info legend');
                    const grades = [
                        {label: 'Federal', color: '#3498db'},
                        {label: 'Estadual', color: '#2ecc71'},
                        {label: 'Municipal', color: '#f1c40f'}
                    ];
                    let legendHtml = '<h4>Legenda</h4>';
                    for (let i = 0; i < grades.length; i++) {
                        legendHtml += `<i style="background:${grades[i].color}"></i> ${grades[i].label}<br>`;
                    }
                    div.innerHTML = legendHtml;
                    return div;
                };
                legend.addTo(map);

            } catch (error) {
                console.error('Erro ao carregar ou processar o ficheiro KMZ:', error);
                loadingStatus.innerHTML = `<p class="text-red-500 font-semibold">Falha ao carregar dados:</p><p class="text-red-700 mt-2">${error.message}</p><p class="mt-2 text-sm text-gray-600">Verifique se o ficheiro está no GitHub e tente recarregar a página.</p>`;
            }
        }
        
        function getCurrentLocation() {
            if (navigator.geolocation) {
                resultDiv.innerHTML = `<p class="text-gray-500 text-center">A obter a sua localização...</p>`;
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        latitudeInput.value = lat.toFixed(7);
                        longitudeInput.value = lon.toFixed(7);
                        resultDiv.innerHTML = `<p class="text-gray-500 text-center">Localização obtida. Clique em "Verificar".</p>`;
                        if(map) {
                            map.flyTo([lat, lon], 13);
                            if(userMarker) userMarker.setLatLng([lat, lon]);
                            else userMarker = L.marker([lat, lon]).addTo(map);
                        }
                    },
                    (error) => {
                        let errorMessage = 'Erro ao obter localização: ';
                        switch (error.code) {
                            case error.PERMISSION_DENIED: errorMessage += "Permissão negada."; break;
                            case error.POSITION_UNAVAILABLE: errorMessage += "Localização indisponível."; break;
                            case error.TIMEOUT: errorMessage += "O pedido expirou."; break;
                            default: errorMessage += "Ocorreu um erro desconhecido."; break;
                        }
                        resultDiv.innerHTML = `<p class="text-red-500 text-center">${errorMessage}</p>`;
                    }, { enableHighAccuracy: true }
                );
            } else {
                resultDiv.innerHTML = `<p class="text-red-500 text-center">Geolocalização não é suportada por este navegador.</p>`;
            }
        }
        
        function checkCoordinates() {
            const lat = parseFloat(latitudeInput.value);
            const lon = parseFloat(longitudeInput.value);

            if (isNaN(lat) || isNaN(lon)) {
                resultDiv.innerHTML = `<p class="text-red-500 text-center">Por favor, insira coordenadas válidas.</p>`;
                return;
            }
            if (!environmentalGeoJson) {
                resultDiv.innerHTML = `<p class="text-red-500 text-center">Dados de áreas ambientais não foram carregados corretamente.</p>`;
                return;
            }

            if (userMarker) map.removeLayer(userMarker);
            if (areaLayerGroup) map.removeLayer(areaLayerGroup);

            const userPoint = [lon, lat];
            let resultsHTML = '';
            let layersToAdd = [];
            
            // Verificação da Área Ambiental
            let foundEnvironmentalArea = environmentalGeoJson.features.find(feature => isPointInFeature(userPoint, feature));
            if (foundEnvironmentalArea) {
                const name = foundEnvironmentalArea.properties.name || 'Nome não disponível';
                const description = foundEnvironmentalArea.properties.description || 'Sem descrição.';
                resultsHTML += `
                    <div class="text-left w-full p-4 bg-green-100 border border-green-300 rounded-lg">
                        <h3 class="font-bold text-lg text-green-800">✅ DENTRO de Área Ambiental!</h3>
                        <p class="mt-2"><strong class="font-semibold text-gray-800">Nome:</strong> ${name}</p>
                        <div class="mt-2"><strong class="font-semibold text-gray-800">Descrição:</strong><div class="mt-1 text-sm text-gray-700 max-h-20 overflow-y-auto">${description}</div></div>
                    </div>`;
                // Camada de destaque
                layersToAdd.push(L.geoJSON(foundEnvironmentalArea.geometry, { style: { color: "#ff7800", weight: 5, opacity: 0.8, fillOpacity: 0.2 } }));
            } else {
                resultsHTML += `
                    <div class="text-left w-full p-4 bg-gray-100 border border-gray-300 rounded-lg">
                        <h3 class="font-bold text-lg text-gray-800">FORA de Área Ambiental.</h3>
                    </div>`;
            }

            resultDiv.innerHTML = resultsHTML;

            userMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>As suas Coordenadas</b><br>Lat: ${lat}<br>Lon: ${lon}`)
                .openPopup();
            
            if (layersToAdd.length > 0) {
                areaLayerGroup = L.featureGroup(layersToAdd).addTo(map);
                const combinedBounds = areaLayerGroup.getBounds().extend(userMarker.getLatLng());
                map.flyToBounds(combinedBounds, {padding: [50, 50]});
            } else {
                map.flyTo([lat, lon], 13);
            }
        }

        // Event Listeners
        getLocationBtn.addEventListener('click', getCurrentLocation);
        checkBtn.addEventListener('click', checkCoordinates);
        
        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
        });
    </script>
</body>
</html>
